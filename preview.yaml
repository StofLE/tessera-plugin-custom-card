# What tools/preview.py of the tessera-plugins repository shows (its docs/PREVIEW.md): a room's climate with icons,
# colours and a bar, a computer's load as three rings (without its name, the values in their colours), two counts with a share, a card whose value is a word,
# eight rooms in two rows of four, eight rooms as a table,
# four climate values on a wide tile (two rows of two), and two counts as pictures (image parts, the pictures from the
# files under pictures:). Never put a secret here.
tiles:
  - tile: card
    name: Computer
    entity: sensor.computer_card
    options: { show_name: false, coloured_values: true, per_row: all }
    sizes: [2x1, 2x2]
  - tile: card
    name: Living room
    entity: sensor.living_room_card
    sizes: [4x2, 2x2, 2x1]
  - tile: card
    name: Entrance
    entity: sensor.entrance_card
    sizes: [1x1, 2x1, 2x2, 4x2]
  - tile: card
    name: House
    entity: sensor.house_table
    sizes: [1x2, 2x2, 3x2, 3x3]
  - tile: card
    name: Front door
    entity: sensor.front_door_card
    sizes: [1x1, 2x1, 2x2]
  - tile: card
    name: Rooms
    entity: sensor.rooms_card
    sizes: [2x2, 3x2, 4x2, 4x4]
  - tile: card
    name: Climate
    entity: sensor.climate_card
    options: { show_name: false, coloured_values: true, per_row: all }
    sizes: [2x1, 2x2]
  - tile: card
    name: Entrance large
    entity: sensor.entrance_pictures
    sizes: [2x2, 3x2, 4x2, 2x1]

states:
  sensor.climate_card:
    state: "9.7"
    attributes:
      elements:
        - "value|9.7|°C|Outside|green|thermometer"
        - "value|19.7|°C|Living|green|sofa"
        - "value|87|%|Outside|blue|water-percent"
        - "value|61|%|Living|yellow|water-percent"
  sensor.computer_card:
    state: "95"
    attributes:
      elements:
        - "ring|95|%|CPU|red"
        - "ring|1|%|GPU|green"
        - "ring|40|%|RAM|yellow"
  sensor.living_room_card:
    state: "823"
    attributes:
      unit_of_measurement: ppm
      elements:
        - "value|19,6|°C|Temperature|blue|thermometer"
        - "value|46|%|Humidity|green|water-percent"
        - "bar|823|ppm|CO2|yellow|molecule-co2|400|2000"
  sensor.entrance_card:
    state: "8704"
    attributes:
      elements:
        - "value|8.704||Scanned"
        - "value|12.499||Valid"
        - "bar|70|%|Share|blue||0|100"
        - "row|15:25||Race day"
  sensor.entrance_pictures:
    state: "5358"
    attributes:
      elements:
        - "image|5358|count_scanned|Scanned"
        - "image|5933|count_valid|Valid"
        - "bar|90|%|Share|blue||0|100"
        - "row|21:00||Concert"
  sensor.front_door_card:
    state: "open"
    attributes:
      elements:
        - "value|open||Lock|red|lock-open-variant"
        - "value|21,4|°C|Hall||thermometer"
        - "text|Window kitchen open||||window-open-variant"
  sensor.rooms_card:
    state: "21,2"
    attributes:
      elements:
        - "value|21,2|°C|Living"
        - "value|20,4|°C|Kitchen"
        - "value|18,1|°C|Bedroom"
        - "value|22,0|°C|Bath"
        - "value|19,5|°C|Office"
        - "value|20,8|°C|Kids"
        - "value|16,3|°C|Hall"
        - "value|12,7|°C|Cellar|blue"
  sensor.house_table:
    state: "17.8"
    attributes:
      elements:
        - "row|20,8|°C|Entrance"
        - "row|21,8|°C|Kitchen"
        - "row|20,8|°C|Bedroom"
        - "row|20,5|°C|Bath"
        - "row|20,7|°C|Dining"
        - "row|20,4|°C|Living"
        - "row|22,7|°C|Attic"
        - "row|17,8|°C|Outside|blue|thermometer"

cards:
  - { card: detail, entity: sensor.living_room_card }

pictures:
  "/api/image_proxy/image.count_scanned?v=5358": preview/count-5358.png
  "/api/image_proxy/image.count_valid?v=5933": preview/count-5933.png
