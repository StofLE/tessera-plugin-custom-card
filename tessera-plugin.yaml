# Custom card: a tile put together from values, bars and lines of text that a Home Assistant template sensor describes.
# The templates live in Home Assistant (a template sensor whose attribute `elements` lists the card's parts); the screen
# draws them with its own fonts and colours. Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: custom_card
version: 0.8.0
api: "0.17"
icon: gauge
maintainer: StofLE
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 12

tiles:
  - id: card
    name: tile_name
    icon: gauge
    sizes: { min: 1x1, max: 4x4 }
    # Eight parts of up to five labels, three blocks and an arc each (two rows of four values), the tile's name and a
    # line for what is missing.
    memory: 7200
    # A place for a picture per part (plugin API 0.10): an image part shows a picture of Home Assistant's own where a
    # value would stand, such as a number a template drew larger than the screen's largest digits.
    pictures: 8
    domains: [sensor]
    # `elements` is the card; a sensor without it shows its own state and unit.
    attributes: [elements, unit_of_measurement]
    # The inspector offers the sensors that describe a card, not every sensor in the house (API 0.5).
    has_attributes: [elements]
    example: tile_example
    preview: { title: "{name}", value: "{state}" }
    # The name over the parts, and the values in the colours of their parts (only their marks when off). Both keep
    # today's look by default (Schumey, pull request #2). How many values stand in a row: the layout chooses, or all in
    # one row, or two to a row (four values on a wide tile as one row of four or two rows of two).
    options:
      - { id: show_name, kind: toggle, label: show_name, hint: show_name_hint, default: true }
      - { id: coloured_values, kind: toggle, label: coloured_values, hint: coloured_values_hint, default: false }
      - id: per_row
        kind: choice
        label: per_row
        hint: per_row_hint
        default: auto
        choices:
          - { value: auto, label: per_row_auto }
          - { value: all, label: per_row_all }
          - { value: two, label: per_row_two }

# A tap on the tile opens its parts large over the page, with their labels, and the pictures of its images (plugin
# API 0.13: pictures on a card, as on the tile).
cards:
  - { id: detail, name: card_name, pictures: 8 }
